services:
  was:
    build:
      context: ../../
      dockerfile: infra/dockerfiles/Dockerfile
    image: was
    container_name: was
    ports:
      - "8000:8000"
    volumes:
      - ../../:/workspace/
    environment:
      - APP_ENV=dev
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  postgres:
    image: postgres:14
    container_name: postgres
    command: postgres -c 'max_connections=250'
    restart: always
    volumes:
      - ../postgres_volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
          - .env.db